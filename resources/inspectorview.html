<!DOCTYPE html>
<html><head>
	<meta charset='utf-8'>
	<title>SCXML Inspector</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource}; script-src 'nonce-${nonce}'">
	<link href="${inspectorViewCSS}" rel="stylesheet">
</head><body>
	<section id="fileToolsSection">
		<h3>SCXML File</h3>
		<div class="filePickerRow">
			<select id="scxmlFileSelect" aria-label="Available SCXML files"></select>
			<button id="openScxmlFileButton" type="button">Show Diagram</button>
		</div>
	</section>
	<p id="selectionSummary" hidden></p>
	<section id="editSection" hidden>
		<h3>Edit</h3>
		<p id="editHint" hidden></p>
		<div class="fieldGrid">
			<label id="stateKindRow" class="field" hidden><span>kind</span><select id="editStateKind"></select></label>
			<label id="idRow" class="field"><span>id</span><input id="editId" type="text"></label>
			<label id="stateParentRow" class="field" hidden><span>parent</span><select id="editParentId"></select></label>
			<label id="stateEntryRow" class="field" hidden><span>on entry</span><button id="addEntryAction" type="button" title="Add entry action">+</button></label>
			<div id="stateEntryActionsRow" class="fieldValueBlock" hidden><div id="entryActions"></div></div>
			<label id="stateExitRow" class="field" hidden><span>on exit</span><button id="addExitAction" type="button" title="Add exit action">+</button></label>
			<div id="stateExitActionsRow" class="fieldValueBlock" hidden><div id="exitActions"></div></div>
			<label id="stateColorRow" class="field" hidden><span>color</span><div class="inputWithButton"><input id="editColor" type="color"><button id="clearColorButton" type="button" title="Clear custom color">×</button></div></label>
			<label id="stateDimensionsRow" class="field" hidden><span>size</span><div class="pairedInputs"><input id="editWidth" type="number" step="10" min="20"><span class="pairSep">×</span><input id="editHeight" type="number" step="10" min="20"></div></label>

			<label id="transKindRow" class="field" hidden><span>kind</span><select id="editTransitionKind"><option value="false">external</option><option value="true">internal</option></select></label>
			<label id="transSourceRow" class="field grouped groupedStart" hidden><span>source</span><select id="editSourceId"></select></label>
			<label id="transSourceAnchorRow" class="field grouped groupedEnd" hidden><span>... anchor</span><div class="pairedInputs anchorInputs"><select id="editSourceAnchorSide"><option value="">(auto)</option><option>N</option><option>S</option><option>E</option><option>W</option></select><input id="editSourceAnchorOffset" type="number" step="5" min="0"></div></label>
			<label id="transEventRow" class="field" hidden><span>event(s)</span><input id="editEvent" type="text"></label>
			<label id="transPlacementRow" class="field" hidden><span>... placement</span><div class="tripleInputs"><select id="editLabelAlign"><option value="">(auto)</option><option>NE</option><option>SE</option><option>NW</option><option>SW</option><option>N</option><option>S</option><option>E</option><option>W</option><option value="C">center</option></select><input id="editLabelOffset" type="number" step="5"><input id="editLabelCrossOffset" type="number" step="5"></div></label>
			<label id="transCondRow" class="field" hidden><span>condition</span><input id="editCondition" type="text"></label>
			<label id="transTargetRow" class="field grouped groupedStart" hidden><span>target</span><select id="editTargetId"></select></label>
			<label id="transTargetAnchorRow" class="field grouped groupedEnd" hidden><span>... anchor</span><div class="pairedInputs anchorInputs"><select id="editTargetAnchorSide"><option value="">(auto)</option><option>N</option><option>S</option><option>E</option><option>W</option></select><input id="editTargetAnchorOffset" type="number" step="5" min="0"></div></label>
			<label id="transActionsRow" class="field" hidden><span>action(s)</span><button id="addTransitionAction" type="button" title="Add transition action">+</button></label>
			<div id="transitionActionsRow" class="fieldValueBlock" hidden><div id="transitionActions"></div></div>
			<label id="transRadiusRow" class="field" hidden><span>radius</span><input id="editRadius" type="number" min="5" step="5"></label>
		</div>
	</section>
	<script src="${inspectorViewJS}"></script>
</body></html>
